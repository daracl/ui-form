<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Daracl Form Documentation</title>
    <meta http-equiv="refresh" content="0; url=./latest/" />
    <link rel="canonical" href="./latest/" />
    <script>
      // HashRouter 경로(#/...)와 query 까지 유지한 채 최신 문서로 이동한다.
      window.location.replace('./latest/' + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="./latest/">the latest documentation</a>&hellip;</p>
  </body>
</html>
